<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Armaan Asif Meer — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C0C0C;--ink:#D7E2EA;--line:#D7E2EA;--white:#fff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);font-family:'Kanit',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}
main{overflow-x:clip;background:var(--bg)}
.hh{background:linear-gradient(180deg,#646973 0%,#BBCCD7 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-weight:900;text-transform:uppercase;line-height:1;letter-spacing:-.02em;text-align:center}
.fi{opacity:0;transform:translate(var(--x,0),var(--y,30px));transition:opacity .7s cubic-bezier(.25,.1,.25,1) var(--d,0s),transform .7s cubic-bezier(.25,.1,.25,1) var(--d,0s)}
.fi.in{opacity:1;transform:none}
.cbtn{display:inline-block;border:0;border-radius:999px;color:#fff;font:500 .85rem 'Kanit',sans-serif;text-transform:uppercase;letter-spacing:.1em;padding:12px 32px;cursor:pointer;text-decoration:none;background:linear-gradient(123deg,#18011F 7%,#B600A8 37%,#7621B0 72%,#BE4C00 100%);box-shadow:0 4px 4px rgba(181,1,167,.25),4px 4px 12px #7721B1 inset;outline:2px solid #fff;outline-offset:-3px}
.gbtn{display:inline-block;border:2px solid var(--line);border-radius:999px;color:var(--ink);font:500 .9rem 'Kanit',sans-serif;text-transform:uppercase;letter-spacing:.1em;padding:10px 32px;text-decoration:none;transition:background .2s}
.gbtn:hover{background:rgba(215,226,234,.1)}
@media(min-width:768px){.cbtn{font-size:1rem;padding:16px 48px}}
/* hero */
.hero{height:100vh;height:100svh;display:flex;flex-direction:column;position:relative;overflow-x:clip;padding:0 24px}
nav{display:flex;justify-content:space-between;padding-top:24px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;font-size:.85rem}
nav a{color:var(--ink);text-decoration:none;transition:opacity .2s}nav a:hover{opacity:.7}
.hero h1{font-size:14vw;white-space:nowrap;width:100%;margin-top:24px;overflow:hidden;line-height:1}.trk{display:flex;width:max-content;animation:slide 22s linear infinite}.grp{display:flex;flex:none}.trk .hh{display:inline-block;padding-right:.25em}.trk .dot{opacity:.6}@keyframes slide{to{transform:translateX(-50%)}}@media(prefers-reduced-motion:reduce){.trk{animation:none}}
.mtrack{display:flex;width:max-content;animation:mq 22s linear infinite}
.mtrack .hh{display:inline-block;padding-right:.15em}
@keyframes mq{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.mtrack{animation:none}}
.bar{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:28px;position:relative;z-index:20}
.bar p{font-weight:300;text-transform:uppercase;letter-spacing:.03em;line-height:1.25;font-size:clamp(.75rem,1.4vw,1.5rem);max-width:160px}
.portrait{position:absolute;left:50%;bottom:0;width:280px;margin-left:-140px;z-index:10;will-change:transform}
.portrait svg{width:100%;display:block}
@media(min-width:640px){nav{font-size:1rem}.hero{padding:0 40px}.hero h1{font-size:15vw;margin-top:16px}.portrait{width:360px;margin-left:-180px}.bar p{max-width:220px}}
@media(min-width:768px){.hero h1{font-size:16vw;margin-top:-20px}.portrait{width:440px;margin-left:-220px}.bar p{max-width:260px}nav{font-size:1.1rem}}
@media(min-width:1024px){.hero h1{font-size:17.5vw}.portrait{width:520px;margin-left:-260px}nav{font-size:1.4rem}}
/* marquee */
.mq{padding:96px 0 40px;overflow:hidden}
.row{display:flex;gap:12px;width:max-content;margin-bottom:12px;will-change:transform}
.tile{width:420px;height:270px;border-radius:24px;flex:none;display:flex;align-items:flex-end;padding:16px;font-weight:500;color:rgba(255,255,255,.85);font-size:.9rem;text-transform:uppercase;letter-spacing:.1em}
/* about */
.about{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:64px;padding:80px 20px;position:relative;text-align:center}
.orb{position:absolute;border-radius:50%;filter:blur(1px)}
.about h2,.svc h2,.proj h2{font-size:clamp(3rem,12vw,160px)}
.reveal{max-width:560px;font-weight:500;line-height:1.625;font-size:clamp(1rem,2vw,1.35rem)}
.w{display:inline-block;white-space:nowrap}.c{opacity:.2}
.txt{display:flex;flex-direction:column;align-items:center;gap:40px;position:relative;z-index:2}
/* services */
.svc{background:var(--white);color:#0C0C0C;border-radius:40px 40px 0 0;padding:80px 20px}
.svc h2{background:none;-webkit-text-fill-color:#0C0C0C;color:#0C0C0C;margin-bottom:64px}
.list{max-width:64rem;margin:0 auto}
.it{display:flex;gap:clamp(16px,4vw,48px);align-items:flex-start;padding:32px 0;border-top:1px solid rgba(12,12,12,.15)}
.it:last-child{border-bottom:1px solid rgba(12,12,12,.15)}
.num{font-weight:900;font-size:clamp(3rem,10vw,140px);line-height:1}
.it h3{font-weight:500;text-transform:uppercase;font-size:clamp(1rem,2.2vw,2.1rem);margin-bottom:8px}
.it p{font-weight:300;line-height:1.6;max-width:42rem;opacity:.6;font-size:clamp(.85rem,1.6vw,1.25rem)}
/* projects */
.proj{background:var(--bg);border-radius:40px 40px 0 0;margin-top:-40px;position:relative;z-index:10;padding:80px 16px 120px}
.proj h2{margin-bottom:48px}
.wrapc{height:85vh;max-width:1150px;margin:0 auto}
.card{position:sticky;top:96px;border:2px solid var(--line);border-radius:40px;background:var(--bg);padding:16px;transform-origin:top center;will-change:transform}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top .num{background:linear-gradient(180deg,#646973,#BBCCD7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.meta small{display:block;font-weight:300;text-transform:uppercase;letter-spacing:.1em;opacity:.7}
.meta b{font-weight:500;text-transform:uppercase;font-size:clamp(1rem,2.2vw,2rem)}
.imgs{display:grid;grid-template-columns:2fr 3fr;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
.ph{border-radius:40px;width:100%}
@media(min-width:640px){.svc,.proj{border-radius:50px 50px 0 0}.card{padding:24px;border-radius:50px}.ph{border-radius:50px}.svc{padding:96px 32px}}
@media(min-width:768px){.svc,.proj{border-radius:60px 60px 0 0}.card{top:128px;padding:32px;border-radius:60px}.ph{border-radius:60px}.svc{padding:128px 40px}.proj{margin-top:-56px}}
footer{text-align:center;padding:30px;font-weight:300;font-size:.9rem;background:var(--bg)}
.portrait{bottom:0;pointer-events:none}.me{width:100%;display:block;filter:drop-shadow(0 0 40px rgba(182,0,168,.4))}
.pic{width:100%;aspect-ratio:1;border-radius:50%;display:block;object-fit:cover;border:6px solid #fff;box-shadow:0 0 0 6px #B600A8,0 0 60px rgba(182,0,168,.55);filter:saturate(1.5) contrast(1.2) url(#toon)}
nav{position:relative;z-index:30}
#cm{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;padding:20px}
#cm.open{display:flex}
.cmc{position:relative;width:100%;max-width:440px;background:var(--bg);border:2px solid var(--line);border-radius:32px;padding:32px 28px;box-shadow:0 0 60px rgba(118,33,176,.5)}
.cmc h3{font-size:2rem;font-weight:900;text-transform:uppercase;margin-bottom:20px}
.cmc a{display:block;color:var(--ink);text-decoration:none;padding:14px 18px;border:2px solid rgba(215,226,234,.35);border-radius:20px;margin-bottom:12px;font-weight:500;word-break:break-word;transition:background .2s}
.cmc a:hover{background:rgba(215,226,234,.1)}
.cmc small{display:block;font-weight:300;text-transform:uppercase;letter-spacing:.1em;opacity:.7;font-size:.75rem}
.x{position:absolute;top:14px;right:18px;background:none;border:0;color:var(--ink);font-size:1.8rem;cursor:pointer}
.certs{background:var(--bg);padding:20px 16px 120px}
.certs h2{font-size:clamp(2.6rem,10vw,140px);font-weight:900;margin-bottom:48px}
.cg{max-width:1150px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.cc{border:2px solid var(--line);border-radius:36px;padding:20px;background:var(--bg)}
.cph{aspect-ratio:4/3;border-radius:24px;display:flex;align-items:center;justify-content:center;font-weight:500;text-transform:uppercase;letter-spacing:.1em;font-size:.8rem;color:rgba(255,255,255,.8);margin-bottom:16px;overflow:hidden}
.cph img{width:100%;height:100%;object-fit:cover}
.cc small{display:block;font-weight:300;text-transform:uppercase;letter-spacing:.1em;opacity:.7}
.cc b{display:block;font-weight:500;text-transform:uppercase;font-size:clamp(1rem,2vw,1.4rem);margin-top:4px}
@media(max-width:480px){nav{font-size:.62rem;letter-spacing:0}}
.wrapc:last-child{height:auto}
.proj{padding-bottom:80px}
.certs{position:relative;z-index:20;padding-top:80px}
.sub{max-width:1150px;margin:0 auto 56px}
.sub h3{display:inline-block;font-weight:500;text-transform:uppercase;letter-spacing:.1em;font-size:1rem;color:#fff;padding:10px 28px;border-radius:999px;margin-bottom:24px;background:linear-gradient(123deg,#18011F 7%,#B600A8 37%,#7621B0 72%,#BE4C00 100%);outline:2px solid #fff;outline-offset:-3px}
.cc.empty{display:flex;align-items:center;justify-content:center;min-height:140px;border-style:dashed;opacity:.7;text-transform:uppercase;letter-spacing:.1em;font-weight:300;text-align:center}
</style>
</head>
